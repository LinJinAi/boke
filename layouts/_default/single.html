{{ define "title" }}{{ .Title }} · {{ .Site.Title }}{{ end }}
{{ define "main" }}
  <article class="post">
    <h1>{{ .Title }}</h1>
    <p class="meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      · {{ .Params.author }}
    </p>
    <div class="tags">
      {{ range .Params.tags }}<span class="tag">#{{ . }}</span>{{ end }}
    </div>
    <hr>
    <div class="content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
